name: Sihti3 CPU experiment
on:
  push:
    branches: [main, sol/coupled-visual-completion]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-visualize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python demo.py --output runs/first --train 320 --steps 16
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: sihti3-visual-results
          path: |
            runs/first/comparison.png
            runs/first/timeline.png
            runs/first/loop.gif
            runs/first/metrics.json
